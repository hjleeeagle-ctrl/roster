<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster 카드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#18202b;--mu:#6b7686;--ln:#d9dfe7;--ac:#0a8f8f;--nx:#d97706;--chip:#eef1f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--card:#161e28;--tx:#e6ecf3;--mu:#8a97a8;--ln:#26313f;--ac:#2dd4cf;--nx:#fbbf24;--chip:#202b38}}
:root[data-theme="dark"]{--bg:#0d1218;--card:#161e28;--tx:#e6ecf3;--mu:#8a97a8;--ln:#26313f;--ac:#2dd4cf;--nx:#fbbf24;--chip:#202b38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header h1{margin:0;font-size:20px}
header .sub{color:var(--mu);margin-top:2px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.sum div{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px 12px}
.sum b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.sum span{color:var(--mu);font-size:11px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools label{display:flex;gap:5px;align-items:center;cursor:pointer}
button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.pri,.btn.pri{background:var(--ac);color:#04201f;border-color:var(--ac);font-weight:600}
#msg{color:var(--nx);margin:6px 0}
#drop.over{outline:2px dashed var(--ac);outline-offset:4px}
.nextbar{background:var(--card);border:1px solid var(--nx);border-left-width:6px;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.nextbar .big{font-size:18px;font-weight:700;color:var(--nx)}
.month{grid-column:1/-1;font-size:15px;font-weight:700;color:var(--mu);margin-top:8px;border-bottom:1px solid var(--ln);padding-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;break-inside:avoid;position:relative}
.card.past{opacity:.55}
.card.off{background:transparent;border-style:dashed;padding:8px 12px}
.card.today{border:2px solid var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.card.next{border:2px solid var(--nx);box-shadow:0 0 0 3px color-mix(in srgb,var(--nx) 28%,transparent)}
.card.today.next{border-color:var(--nx)}
.dh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dd{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.dw{color:var(--mu);font-weight:600}.dw.we{color:#e0566b}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;color:#fff}
.tag.t{background:var(--ac);color:#04201f}.tag.n{background:var(--nx);color:#2a1700}
.dtot{margin-left:auto;color:var(--mu);font-size:12px}
.fl{border-top:1px solid var(--ln);padding:8px 0}
.fl:first-of-type{border-top:0}
.fl.cur{background:color-mix(in srgb,var(--nx) 14%,transparent);border-radius:8px;padding:8px}
.r1{display:flex;align-items:center;gap:8px}
.no{font-weight:800;font-size:16px}
.ac{color:var(--mu);font-size:12px;margin-left:auto}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:4px 0;text-align:center}
.route .st{font-size:20px;font-weight:800;letter-spacing:.5px}
.route .tm{font-size:15px;font-variant-numeric:tabular-nums}
.route .ar{color:var(--mu);font-size:12px;padding:0 6px}
.route sup{color:var(--nx);font-weight:700}
.crew{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:11.5px}
.chip.me{outline:1px solid var(--ac)}.chip.tvl{font-style:italic;color:var(--mu)}
.cd{font-size:12px;color:var(--nx);font-weight:700;margin-top:2px}
.note{color:var(--mu);font-size:12px}
.foot{color:var(--mu);font-size:11px;margin-top:16px}
.apt{all:unset;cursor:pointer;border-bottom:1px dotted var(--mu)}.apt:hover{color:var(--ac)}
@media print{.apt{border:0}}
@media print{
 @page{size:A4;margin:8mm}
 :root,:root[data-theme]{--bg:#fff;--card:#fff;--tx:#000;--mu:#555;--ln:#bbb;--ac:#0a6f6f;--nx:#b45309;--chip:#eee;padding:0}
 body{font-size:9.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .tools,#msg,.noprint{display:none!important}
 .wrap{padding:0;max-width:none}
 .grid{grid-template-columns:repeat(3,1fr);gap:6px}
 .card{padding:6px;border-radius:6px}.card.past{opacity:1}
 .dd{font-size:15pt}.route .st{font-size:13pt}
}
</style>
</head>
<body>
<div class="wrap" id="drop">
<header>
 <h1 id="ttl">Roster</h1>
 <div class="sub" id="sub"></div>
</header>
<div class="sum" id="sum"></div>
<div class="tools">
 <label class="btn pri">📂 Roster 불러오기 (.xlsx)<input type="file" id="f" accept=".xlsx,.xls,.csv" hidden></label>
 <label><input type="checkbox" id="oPast" checked> 지난 비행 표시</label>
 <label><input type="checkbox" id="oOff"> 휴무·체류일 표시</label>
 <label><input type="checkbox" id="oCrew" checked> 승무원 표시</label>
 <button id="bTheme">🌓</button>
 <button id="bReset">샘플로 초기화</button>
 <button class="pri" onclick="window.print()">🖨 인쇄 / PDF</button>
</div>
<div id="msg"></div>
<div id="nextbar"></div>
<div class="grid" id="grid"></div>
<div class="foot">※ STD/STA는 각 공항 현지시각 기준이며, 오늘 날짜·카운트다운은 KST 기준입니다. 미등록 공항은 KST로 가정합니다. 파일은 브라우저 안에서만 처리됩니다.</div>
</div>

from":"ICN","std":"2026-10-18 12:35","to":"CTS","sta":"2026-10-18 15:20","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2574257","nm":"SUH DONGYEOB","cm":""}]},{"no":"KE770","from":"CTS","std":"2026-10-18 16:20","to":"ICN","sta":"2026-10-18 19:30","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2574257","nm":"SUH DONGYEOB","cm":""}]},{"no":"KE851","from":"ICN","std":"2026-10-21 08:15","to":"PEK","sta":"2026-10-21 09:40","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2446737","nm":"LEE JAEHO","cm":""}]},{"no":"KE2066","from":"PEK","std":"2026-10-21 10:50","to":"CJU","sta":"2026-10-21 14:25","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2446737","nm":"LEE JAEHO","cm":""}]},{"no":"KE2065","from":"CJU","std":"2026-10-22 15:35","to":"PEK","sta":"2026-10-22 17:20","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2446737","nm":"LEE JAEHO","cm":""}]},{"no":"KE852","from":"PEK","std":"2026-10-22 18:30","to":"ICN","sta":"2026-10-22 21:40","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2446737","nm":"LEE JAEHO","cm":""}]},{"no":"KE137","from":"ICN","std":"2026-10-25 09:15","to":"XIY","sta":"2026-10-25 11:45","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2561323","nm":"PARK JINWOO","cm":""}]},{"no":"KE138","from":"XIY","std":"2026-10-25 12:55","to":"ICN","sta":"2026-10-25 16:45","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2561323","nm":"PARK JINWOO","cm":""}]},{"no":"KE125","from":"ICN","std":"2026-10-28 10:05","to":"XMN","sta":"2026-10-28 12:30","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2436824","nm":"CHOI HYUNWOO","cm":""}]},{"no":"KE126","from":"XMN","std":"2026-10-28 13:40","to":"ICN","sta":"2026-10-28 17:50","ac":"3QP","crew":[{"rk":"FO","du":"FLY","pic":"F1","id":"2436824","nm":"CHOI HYUNWOO","cm":""}]},{"no":"KE145","from":"ICN","std":"2026-10-31 20:20","to":"CSX","sta":"2026-10-31 22:55","ac":"3QP","crew":[{"rk":"CAP","du":"FLY","pic":"P2","id":"1502023","nm":"LEE HYUNGJOO","cm":""},{"rk":"FO","du":"FLY","pic":"F2","id":"1404690","nm":"KONG SUNG JAE","cm":""},{"rk":"FO","du":"FLY","pic":"F1","id":"2487471","nm":"KIM MINSEOP","cm":""}]}]};
const TZ={};
"ICN GMP PUS CJU TAE KWJ NRT HND KIX ITM NGO FUK CTS OKA KMJ KMQ HIJ OKJ SDJ UKB".split(" ").forEach(a=>TZ[a]=9);
"PEK PKX PVG SHA XIY XMN CSX CAN CTU TAO DLC SHE HGH NKG TSN SZX HAK CKG WUH KMG TPE KHH HKG MFM MNL CEB SIN KUL DPS ULN CGO TNA YNT WEH SYX".split(" ").forEach(a=>TZ[a]=8);
"BKK HAN SGN DAD CXR PQC CGK REP VTE PNH".split(" ").forEach(a=>TZ[a]=7);
TZ.GUM=10;TZ.SPN=10;TZ.HNL=-10;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WD=["일","월","화","수","목","금","토"];
let D=null,saved=false;
const pad=n=>String(n).padStart(2,"0");
function ts(v){ // -> "YYYY-MM-DD HH:MM"
 if(v instanceof Date)return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())} ${pad(v.getHours())}:${pad(v.getMinutes())}`;
 const m=String(v||"").match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})[ T]+(\d{1,2}):(\d{2})/);
 return m?`${m[1]}-${pad(m[2])}-${pad(m[3])} ${pad(m[4])}:${m[5]}`:"";
}
function utc(s,ap){const m=s.match(/(\d+)-(\d+)-(\d+) (\d+):(\d+)/);return Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])-(TZ[ap]??9)*36e5}
function parse(rows){
 const o={name:"",id:"",fleet:"",rank:"",sum:{},acts:[]};
 const t=String((rows[0]||[]).find(x=>String(x).includes("|"))||"").split("|").map(s=>s.trim());
 [o.name,o.id,o.fleet,o.rank]=t;
 const all=(rows[0]||[]).join(" ");
 const g=(k)=>(all.match(new RegExp(k+"\\s+([\\d:]+)"))||[])[1];
 o.sum={FLY:g("FLY"),TVL:g("TVL"),DO:g("DO"),RSV:g("RESERVE")};
 let H=null,cur=null;
 for(let i=1;i<rows.length;i++){
  const r=rows[i].map(x=>x instanceof Date?x:String(x??"").trim?.()??x);
  if(r.some(x=>x==="Flight/Activity")){
   const ix=n=>r.findIndex(x=>x===n);
   H={no:ix("Flight/Activity"),from:ix("From"),std:ix("STD"),to:ix("To"),sta:ix("STA"),ac:ix("A/C"),rk:ix("Acting rank"),du:ix("Duty"),pic:ix("PIC code"),id:ix("Crew ID"),nm:ix("Name"),cm:ix("Comment"),sp:ix("Special Duty Code")};
   continue}
  if(!H)continue;
  const first=(a,b)=>{for(let k=a;k<b;k++)if(r[k])return r[k];return""};
  if(r[H.no]){
   const std=ts(rows[i][H.std]),sta=ts(rows[i][H.sta]);
   cur={no:r[H.no],from:r[H.from]||"",to:r[H.to]||"",std,sta,ac:r[H.ac]||"",crew:[]};
   o.acts.push(cur);
  } else if(cur&&(r[H.rk]||r[H.id])){
   cur.crew.push({rk:r[H.rk]||"",du:r[H.du]||"",pic:r[H.pic]||"",id:r[H.id]||"",nm:first(H.nm,H.cm),cm:first(H.cm,H.sp)});
  }
 }
 o.acts=o.acts.filter(a=>a.std||a.sta);
 o.acts.forEach(a=>{if(!a.std)a.std=a.sta});
 return o}
function load(o){D=o;render()}
function render(){
 if(!D)return;
 const now=Date.now(),kst=new Date(now+9*36e5),today=kst.toISOString().slice(0,10);
 const isFl=a=>a.from&&a.to&&a.from!==a.to&&a.sta;
 const A=D.acts.map(a=>({...a,s:utc(a.std,a.from),e:a.sta?utc(a.sta,a.to||a.from):null,fl:false}));
 A.forEach(a=>a.fl=isFl(a));
 A.sort((x,y)=>x.s-y.s);
 const nxt=A.find(a=>a.fl&&a.e>now);
 const mine=a=>a.crew.find(c=>c.id===D.id)||{};
 const base=(()=>{const c={};A.forEach(a=>{c[a.from]=(c[a.from]||0)+1;c[a.to]=(c[a.to]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||"ICN"})();
 $("ttl").textContent=`${D.name||"Roster"}`;
 $("sub").textContent=[D.id,D.fleet,D.rank].filter(Boolean).join(" · ")+(saved?" · 💾 저장된 roster":" · 샘플 roster");
 const sm=D.sum||{};
 $("sum").innerHTML=[["FLY",sm.FLY],["TVL",sm.TVL],["DO",sm.DO],["RESERVE",sm.RSV]].filter(x=>x[1]!=null).map(x=>`<div><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join("");
 // next bar
 const nb=$("nextbar");
 if(nxt){
  const live=nxt.s<=now;
  nb.className="nextbar";
  nb.innerHTML=`<div class="note">${live?"현재 비행 중":"다음 비행"}</div><div class="big">${esc(nxt.no)} · <a class="apt" href="${apLink(nxt.from)}" target="_blank" rel="noopener">${esc(nxt.from)}</a> → <a class="apt" href="${apLink(nxt.to)}" target="_blank" rel="noopener">${esc(nxt.to)}</a></div><div>${nxt.std.slice(5,10).replace("-","/")} (${WD[new Date(nxt.std.slice(0,10)+"T00:00:00Z").getUTCDay()]}) STD ${nxt.std.slice(11)} <span class="note">(${esc(nxt.from)} 현지)</span></div><div class="cd" id="cd"></div>`;
  tick(nxt,now);
 } else {nb.className="";nb.innerHTML=""}
 // group by date
 const days={};
 A.forEach(a=>{(days[a.std.slice(0,10)]??=[]).push(a)});
 let keys=Object.keys(days);
 const showOff=$("oOff").checked;
 if(A.length){
  const mn=A[0].std.slice(0,7),mx=A[A.length-1].std.slice(0,7);
  const [y0,m0]=mn.split("-").map(Number),[y1,m1]=mx.split("-").map(Number);
  const st=new Date(Date.UTC(y0,m0-1,1)),en=new Date(Date.UTC(y1,m1,0));
  const inRange=today>=st.toISOString().slice(0,10)&&today<=en.toISOString().slice(0,10);
  if(showOff){for(let d=new Date(st);d<=en;d.setUTCDate(d.getUTCDate()+1))keys.push(d.toISOString().slice(0,10))}
  else if(inRange)keys.push(today);
 }
 keys=[...new Set(keys)].sort();
 const showPast=$("oPast").checked,showCrew=$("oCrew").checked;
 const nxtDate=nxt&&nxt.std.slice(0,10);
 let html="",lastM="";
 for(const k of keys){
  if(!showPast&&k<today&&!(days[k]||[]).some(a=>a===nxt))continue;
  const m=k.slice(0,7);
  if(m!==lastM){html+=`<div class="month">${m.replace("-","년 ")}월</div>`;lastM=m}
  const dt=new Date(k+"T00:00:00Z"),wd=dt.getUTCDay();
  const diff=Math.round((dt-new Date(today+"T00:00:00Z"))/864e5);
  const isT=k===today,hasN=(days[k]||[]).includes(nxt);
  const cls=["card",isT?"today":"",hasN?"next":"",diff<0?"past":"",days[k]?"":"off"].join(" ");
  let h=`<div class="${cls}"><div class="dh"><span class="dd">${k.slice(8)}</span><span class="dw ${wd==0||wd==6?"we":""}">${WD[wd]}</span>`;
  if(isT)h+=`<span class="tag t">TODAY</span>`;
  if(hasN)h+=`<span class="tag n">NEXT FLIGHT</span>`;
  if(!isT)h+=`<span class="note">${diff>0?"D-"+diff:"D+"+(-diff)}</span>`;
  const list=days[k]||[];
  if(!list.length){
   const prev=[...A].filter(a=>a.fl&&a.e!=null&&a.sta.slice(0,10)<=k&&a.std.slice(0,10)<k).pop();
   const next=A.find(a=>a.fl&&a.std.slice(0,10)>k);
   const arr=A.filter(a=>a.fl&&a.sta.slice(0,10)===k&&a.std.slice(0,10)<k);
   const stay=prev&&next&&prev.to!==base?prev.to:"";
   h+=`</div><div class="note">${stay?`체류 · ${esc(stay)}`:"휴무 / 비운항"}${arr.length?` · ${arr.map(a=>esc(a.no)+" 도착").join(", ")}`:""}</div></div>`;
   html+=h;continue}
  let tot=0;
  const fh=list.map(a=>{
   const me=mine(a),dh=me.du==="TVL";
   const dur=a.fl?Math.round((a.e-a.s)/6e4):0;
   if(a.fl&&!dh)tot+=dur;
   const plus=a.sta&&a.sta.slice(0,10)>a.std.slice(0,10);
   const cur=a===nxt;
   const crew=a.crew.filter(c=>c.id!==D.id).map(c=>`<span class="chip ${c.du==="TVL"?"tvl":""}">${esc(c.du==="TVL"?"TVL":c.pic||c.rk)} ${esc(c.rk)} ${esc(c.nm)}</span>`).join("");
   return `<div class="fl ${cur?"cur":""}"><div class="r1"><span class="no">${esc(a.no)}</span>${me.pic?`<span class="chip me">${esc(me.pic)}${dh?" · TVL":""}</span>`:""}${a.fl?`<span class="note">${Math.floor(dur/60)}h${pad(dur%60)}</span>`:""}<span class="ac">${esc(a.ac)}</span></div>
   ${a.from||a.to?`<div class="route"><div><div class="st"><a class="apt" href="${apLink(a.from)}" target="_blank" rel="noopener">${esc(a.from)}</a></div><div class="tm">${a.std.slice(11)}</div></div><div class="ar">→</div><div><div class="st"><a class="apt" href="${apLink(a.to)}" target="_blank" rel="noopener">${esc(a.to)}</a></div><div class="tm">${a.sta?a.sta.slice(11):""}${plus?"<sup>+1</sup>":""}</div></div></div>`:`<div class="tm">${a.std.slice(11)}${a.sta?" – "+a.sta.slice(11):""}</div>`}
   ${cur?`<div class="cd" data-cd="1"></div>`:""}
   ${showCrew&&crew?`<div class="crew">${crew}</div>`:""}</div>`}).join("");
  h+=`${tot?`<span class="dtot">Block ${Math.floor(tot/60)}h${pad(tot%60)}</span>`:""}</div>${fh}</div>`;
  html+=h;
 }
 $("grid").innerHTML=html||`<div class="note">표시할 일정이 없습니다.</div>`;
 tick(nxt,now);
}
function tick(n,now=Date.now()){
 if(!n)return;
 const live=n.s<=now,ms=(live?n.e:n.s)-now;
 if(ms<0)return;
 const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60);
 const t=`${live?"도착까지":"STD까지"} ${d?d+"일 ":""}${h}시간 ${m%60}분`;
 document.querySelectorAll("#cd,[data-cd]").forEach(e=>e.textContent=t);
}
setInterval(()=>{if(D)render()},60000);
async function readFile(file){
 try{
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const o=parse(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}));
  if(!o.acts.length)throw new Error("비행 데이터를 찾지 못했습니다 (Flight/Activity 헤더 확인)");
  $("msg").textContent="";saved=true;load(o);
  try{localStorage.setItem("rosterCards",JSON.stringify(o))}catch(e){}
 }catch(e){$("msg").textContent="파일을 읽지 못했습니다: "+e.message}
}
$("f").onchange=e=>e.target.files[0]&&readFile(e.target.files[0]);
const dz=$("drop");
dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};
dz.ondragleave=()=>dz.classList.remove("over");
dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");e.dataTransfer.files[0]&&readFile(e.dataTransfer.files[0])};
["oPast","oOff","oCrew"].forEach(i=>$(i).onchange=render);
$("bReset").onclick=()=>{try{localStorage.removeItem("rosterCards")}catch(e){}saved=false;load(SAMPLE)};
let th="dark";try{th=localStorage.getItem("rosterTheme")||"dark"}catch(e){}
document.documentElement.dataset.theme=th;
$("bTheme").onclick=()=>{th=th==="dark"?"light":"dark";document.documentElement.dataset.theme=th;try{localStorage.setItem("rosterTheme",th)}catch(e){}};
const ICAO={ICN:"RKSI",GMP:"RKSS",PUS:"RKPK",CJU:"RKPC",TAE:"RKTN",KWJ:"RKJJ",CJJ:"RKTU",MWX:"RKJB",USN:"RKPU",RSU:"RKJY",HIN:"RKPS",KUV:"RKJK",YNY:"RKNY",WJU:"RKNW",NRT:"RJAA",HND:"RJTT",KIX:"RJBB",ITM:"RJOO",NGO:"RJGG",FUK:"RJFF",CTS:"RJCC",OKA:"ROAH",KMJ:"RJFT",HIJ:"RJOA",SDJ:"RJSS",KMQ:"RJNK",OKJ:"RJOB",KMI:"RJFM",NGS:"RJFU",KOJ:"RJFK",MYJ:"RJOM",TAK:"RJOT",AOJ:"RJSA",TOY:"RJNT",UKB:"RJBE",TPE:"RCTP",KHH:"RCKH",RMQ:"RCMQ",TSA:"RCSS",PEK:"ZBAA",PKX:"ZBAD",PVG:"ZSPD",SHA:"ZSSS",HKG:"VHHH",MFM:"VMMC",MNL:"RPLL",CEB:"RPVM",SIN:"WSSS",KUL:"WMKK",BKK:"VTBS",HAN:"VVNB",SGN:"VVTS",DAD:"VVDN",CXR:"VVCR",PQC:"VVPQ",CGK:"WIII",DPS:"WADD",ULN:"ZMCK",XIY:"ZLXY",XMN:"ZSAM",TAO:"ZSQD",DLC:"ZYTL",SHE:"ZYTX",HGH:"ZSHC",NKG:"ZSNJ",TSN:"ZBTJ",SZX:"ZGSZ",CAN:"ZGGG",CTU:"ZUUU",CKG:"ZUCK",WUH:"ZHHH",KMG:"ZPPP",HAK:"ZJHK",SYX:"ZJSY",GUM:"PGUM",SPN:"PGSN",HNL:"PHNL"};
function apLink(c){const ic=ICAO[c]||(/^[A-Z]{4}$/.test(c)?c:"");return ic?`https://aviationweather.gov/data/metar/?ids=${ic}&taf=1`:"https://aviationweather.gov/data/metar/"}
let init=SAMPLE;try{const s=localStorage.getItem("rosterCards");if(s){init=JSON.parse(s);saved=true}}catch(e){}
load(init);
</script>
